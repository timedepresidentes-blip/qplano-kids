<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QPlano Kids</title>
    <meta name="description" content="App de aprendizado espacial para crianças" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
      /* ── Tokens ── */
      :root {
        --display: 'Nunito', sans-serif;
        --body: 'Nunito Sans', sans-serif;

        --bg:        #070c22;
        --bg2:       #0a1240;
        --text:      #f1f4ff;
        --muted:     #8fa3d8;
        --edge:      rgba(165,190,255,.22);
        --glass:     rgba(16,28,80,.55);
        --glass-strong: rgba(24,40,104,.65);

        --sun:       #ffc531;
        --sun-hi:    #ffe27a;
        --flare:     #ff9320;
        --good:      #46e0a4;
        --good-bg:   rgba(14,68,52,.65);
        --bad:       #ff6b6b;
        --bad-bg:    rgba(80,14,14,.65);
      }

      /* ── Reset ── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html { font-size: 16px; scroll-behavior: smooth; }

      body {
        font-family: var(--body);
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        overflow-x: hidden;
        /* Fundo estrelado */
        background-image:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(60,100,200,.35) 0%, transparent 70%),
          radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.8) 0%, transparent 100%),
          radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,.7) 0%, transparent 100%),
          radial-gradient(1px 1px at 55% 85%, rgba(255,255,255,.6) 0%, transparent 100%),
          radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,.5) 0%, transparent 100%),
          radial-gradient(1px 1px at 90% 20%, rgba(255,255,255,.6) 0%, transparent 100%),
          radial-gradient(1px 1px at 35% 55%, rgba(255,255,255,.4) 0%, transparent 100%),
          radial-gradient(1px 1px at 65% 10%, rgba(255,255,255,.5) 0%, transparent 100%);
        background-attachment: fixed;
      }

      #root { isolation: isolate; }

      button { font-family: var(--body); }
      h1,h2,h3,h4 { font-family: var(--display); }

      img, svg { display: block; max-width: 100%; }

      /* Scrollbar fina */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(165,190,255,.3); border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
