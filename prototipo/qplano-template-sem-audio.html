<title>QPlano Kids</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: glass panels floating over a live 3D sky (planets, stars, a 3D Quasar tied to a slot in the page); dark space look chosen on purpose for a child's screen */
:root {
  --bg: #070c22;
  --bg2: #0d1640;
  --glass: rgba(22, 34, 88, .58);
  --glass-strong: rgba(26, 40, 104, .8);
  --edge: rgba(165, 190, 255, .24);
  --text: #f1f4ff;
  --muted: #b3c0ee;
  --sun: #ffc531;
  --sun-hi: #ffe27a;
  --flare: #ff8a3d;
  --good: #46e0a4;
  --good-bg: rgba(16, 78, 66, .75);
  --bad: #ff8f9a;
  --bad-bg: rgba(94, 28, 52, .75);
  --focus: #8fd3ff;
  --glow: #7aa7ff;
  --display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 56px;
  overflow-x: hidden;
}
.sky {
  position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    radial-gradient(700px 420px at 85% 8%, rgba(128, 92, 255, .32), transparent 70%),
    radial-gradient(800px 520px at 8% 92%, rgba(40, 130, 255, .28), transparent 70%),
    radial-gradient(1.6px 1.6px at 14% 20%, #fff 60%, transparent 62%),
    radial-gradient(1.6px 1.6px at 82% 34%, #fff 60%, transparent 62%),
    radial-gradient(2px 2px at 46% 12%, #ffe9a8 60%, transparent 62%),
    radial-gradient(1.6px 1.6px at 30% 66%, #cfe0ff 60%, transparent 62%),
    linear-gradient(180deg, #0a1236 0%, #070c22 70%);
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
#app { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; position: relative; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 26px; }
h3 { font-size: 19px; letter-spacing: .2px; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; min-width: 0; }
.brand { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: .3px; text-shadow: 0 0 18px rgba(122, 167, 255, .55); display: flex; align-items: center; gap: 4px; }
.brand b { color: var(--sun); text-shadow: 0 0 18px rgba(255, 197, 49, .7); }
.backbtn { background: var(--glass); border: 1px solid var(--edge); border-radius: 12px; width: 36px; height: 36px; margin-right: 6px; font-size: 18px; line-height: 1; }
.chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--glass); border: 1px solid var(--edge); border-radius: 999px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 5px 13px; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums;
}
.chip svg { width: 18px; height: 18px; }
.iconbtn { background: var(--glass); border: 1px solid var(--edge); border-radius: 999px; width: 40px; height: 40px; display: grid; place-items: center; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn[aria-pressed="false"] { opacity: .5; }
.iconbtn[aria-pressed="false"]::after { content: ""; position: absolute; width: 22px; height: 2px; background: var(--muted); transform: rotate(-45deg); }
.iconbtn { position: relative; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 20px; padding: 14px 24px; min-height: 56px;
  font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: .3px;
  background: linear-gradient(180deg, var(--sun-hi), var(--sun) 45%, var(--flare));
  color: #2a1700;
  box-shadow: 0 4px 0 #b95f00, 0 12px 28px rgba(255, 150, 40, .38), inset 0 2px 0 rgba(255, 255, 255, .55);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b95f00, 0 6px 16px rgba(255, 150, 40, .3), inset 0 2px 0 rgba(255, 255, 255, .5); }
.btn.alt { background: var(--glass); color: var(--text); border: 1px solid var(--edge); box-shadow: 0 4px 0 rgba(5, 9, 30, .7), inset 0 1px 0 rgba(255, 255, 255, .12); font-size: 17px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.btn.alt:active { box-shadow: 0 1px 0 rgba(5, 9, 30, .7); }
.btn.small { min-height: 44px; padding: 8px 18px; font-size: 16px; border-radius: 14px; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 8px; font-weight: 700; }

/* panels */
.card {
  background: var(--glass); border: 1px solid var(--edge); border-radius: 24px; padding: 18px; min-width: 0;
  backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
  box-shadow: 0 14px 36px rgba(0, 0, 8, .4), inset 0 1px 0 rgba(255, 255, 255, .1);
}
.row { display: flex; gap: 12px; align-items: center; min-width: 0; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.stat {
  flex: 1 1 90px; text-align: center; border-radius: 20px; padding: 12px 8px;
  background: linear-gradient(180deg, rgba(60, 84, 190, .5), rgba(24, 36, 100, .5)); border: 1px solid var(--edge);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.stat b { display: block; font-family: var(--display); font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 16px rgba(255, 197, 49, .35); }
.stat span { font-size: 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }

/* Quasar slot + bubble */
.say { display: flex; gap: 8px; align-items: flex-end; }
.q-slot { flex: none; width: 118px; height: 150px; position: relative; }
.q-slot.big { width: 148px; height: 190px; }
.q-slot .quasar { width: 100%; height: 100%; animation: bob 3.2s ease-in-out infinite; }
body.has3d .q-slot .quasar { visibility: hidden; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.bubble {
  position: relative; background: linear-gradient(180deg, #ffffff, #e6edff); color: #141f4d;
  border-radius: 24px 24px 24px 8px; padding: 15px 18px; font-weight: 800; font-size: 19px; min-width: 0; flex: 1;
  box-shadow: 0 12px 30px rgba(0, 0, 10, .4), 0 0 0 4px rgba(255, 255, 255, .08);
}
.bubble.q { font-size: 21px; }
.talk .bubble { box-shadow: 0 12px 30px rgba(0, 0, 10, .4), 0 0 0 4px rgba(255, 197, 49, .45); }

/* destinations */
.dest { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.d { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 18px; border: 1px solid var(--edge); background: rgba(10, 18, 60, .55); min-width: 0; font-weight: 800; }
.d.on { border-color: var(--sun); background: linear-gradient(180deg, rgba(120, 90, 10, .55), rgba(60, 44, 8, .55)); box-shadow: 0 0 22px rgba(255, 197, 49, .22); }
.d.off { opacity: .55; }
.d small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; }
.d svg { width: 28px; height: 28px; flex: none; }

/* medals */
.medals { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.medal { text-align: center; padding: 12px 6px; border-radius: 18px; background: rgba(10, 18, 60, .55); border: 1px solid var(--edge); min-width: 0; }
.medal svg { width: 50px; height: 50px; filter: drop-shadow(0 4px 10px rgba(255, 197, 49, .4)); }
.medal b { display: block; font-size: 14px; line-height: 1.2; margin-top: 4px; }
.medal small { color: var(--muted); font-size: 12px; display: block; }
.medal.lock { opacity: .42; filter: grayscale(1); }
.medal.lock svg { filter: none; }

/* quiz */
.prog { flex: 1; min-width: 80px; height: 12px; border-radius: 8px; background: rgba(10, 18, 60, .7); border: 1px solid var(--edge); overflow: hidden; }
.prog > i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--flare), var(--sun)); box-shadow: 0 0 14px rgba(255, 197, 49, .6); transition: width .4s; }
.opts { display: grid; gap: 12px; }
.opt {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
  background: var(--glass-strong); border: 1px solid var(--edge); border-radius: 20px;
  padding: 13px 16px; font-weight: 800; font-size: 19px; min-height: 62px; min-width: 0;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 5px 0 rgba(4, 8, 28, .75), 0 12px 24px rgba(0, 0, 10, .3), inset 0 1px 0 rgba(255, 255, 255, .12);
  transition: transform .08s, box-shadow .08s, border-color .2s;
}
.opt .k { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(180deg, #2c3f9a, #16226a); font-family: var(--display); font-size: 20px; color: var(--sun); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25); }
.opt span:last-child { min-width: 0; overflow-wrap: anywhere; }
.opt:not([disabled]):active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(4, 8, 28, .75), inset 0 1px 0 rgba(255, 255, 255, .12); }
.opt.ok { border-color: var(--good); background: var(--good-bg); box-shadow: 0 0 28px rgba(70, 224, 164, .45), 0 5px 0 rgba(4, 8, 28, .75); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt[disabled] { cursor: default; }
.fb { border-radius: 22px; padding: 16px 18px; border: 1px solid; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.fb.ok { background: var(--good-bg); border-color: var(--good); }
.fb.bad { background: var(--bad-bg); border-color: var(--bad); }
.fb h3 { margin-bottom: 4px; font-size: 22px; }
.note { margin-top: 10px; padding: 10px 14px; background: rgba(120, 90, 10, .55); border: 1px solid var(--sun); border-radius: 14px; font-weight: 800; }
.hint { color: var(--muted); font-size: 15px; min-height: 22px; }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { filter: brightness(1.15); transform: scale(1.02); } }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  max-width: min(92vw, 520px); background: var(--glass-strong); border: 1px solid var(--edge); border-radius: 16px;
  padding: 10px 16px; font-weight: 700; font-size: 15px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .3s;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
#toast.on { opacity: 1; }

/* celebration */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none; }
.banner { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(.3); z-index: 31; text-align: center; pointer-events: none; opacity: 0; width: min(92vw, 520px); }
.banner.on { animation: pop 2.6s cubic-bezier(.2, 1.3, .4, 1) forwards; }
.banner::before { content: ""; position: absolute; inset: -34px -24px; z-index: -1; background: radial-gradient(closest-side, rgba(7, 12, 34, .88) 55%, transparent); }
.banner h2 { font-size: clamp(36px, 11vw, 62px); color: var(--sun-hi); text-shadow: 0 0 24px rgba(255, 197, 49, .9), 0 4px 0 #b95f00, 0 10px 30px rgba(0, 0, 10, .55); letter-spacing: .5px; }
.banner p { font-family: var(--display); font-size: 22px; font-weight: 700; text-shadow: 0 2px 12px rgba(0, 0, 10, .7); margin-top: 4px; }
.banner svg { width: 100%; height: auto; filter: drop-shadow(0 6px 18px rgba(255, 197, 49, .85)); }
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-6deg); }
  14% { opacity: 1; transform: translate(-50%, -50%) scale(1.14) rotate(2deg); }
  24% { transform: translate(-50%, -50%) scale(1) rotate(0); }
  80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -62%) scale(1.05); }
}
.float { position: fixed; z-index: 31; pointer-events: none; font-family: var(--display); font-weight: 800; font-size: 30px; white-space: nowrap; color: var(--sun-hi); text-shadow: 0 0 14px rgba(255, 197, 49, .9), 0 3px 0 #b95f00; animation: floatup 1.3s ease-out forwards; }
@keyframes floatup {
  0% { opacity: 0; transform: translate(-50%, 0) scale(.6); }
  15% { opacity: 1; transform: translate(-50%, -12px) scale(1.2); }
  100% { opacity: 0; transform: translate(-50%, -90px) scale(1); }
}
.stars3 { display: flex; justify-content: center; gap: 12px; }
.stars3 svg { width: 68px; height: 68px; opacity: .2; transform: scale(.6); }
.stars3 svg.on { animation: starin .6s cubic-bezier(.2, 1.6, .4, 1) forwards; }
@keyframes starin { to { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 14px rgba(255, 197, 49, .9)); } }

/* parents */
.bars { display: grid; gap: 8px; }
.brow { display: grid; grid-template-columns: 62px 1fr 92px; gap: 8px; align-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.track { height: 12px; background: rgba(10, 18, 60, .7); border-radius: 8px; overflow: hidden; border: 1px solid var(--edge); }
.fill { height: 100%; background: linear-gradient(90deg, var(--flare), var(--sun)); border-radius: 8px; }
select { background: rgba(10, 18, 60, .8); color: var(--text); border: 1px solid var(--edge); border-radius: 12px; padding: 9px 12px; font: inherit; }
ul.plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
ul.plain li { background: rgba(10, 18, 60, .55); border-radius: 14px; padding: 9px 13px; font-size: 15px; }
.disc { font-size: 14px; color: var(--muted); border-top: 1px solid var(--edge); padding-top: 10px; }

@media (prefers-reduced-motion: reduce) {
  .q-slot .quasar, .pulse { animation: none; }
  .btn, .opt, .prog > i { transition: none; }
}
@media (max-width: 420px) {
  .q-slot { width: 96px; height: 124px; }
  .q-slot.big { width: 120px; height: 156px; }
  .bubble { font-size: 17px; padding: 13px 15px; }
  .bubble.q { font-size: 19px; }
  .brand { font-size: 24px; }
}
</style>

<div class="sky" aria-hidden="true"></div>
<main id="app" aria-live="polite"></main>
<div id="toast" role="status"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="banner" id="banner" aria-live="assertive"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- Banco de perguntas: trilha Espaço (nível, pergunta, alternativas, índice certo, explicação) ---------- */
  var QS = [
    [1, "Qual estrela ilumina e aquece a Terra?", ["Lua", "Sol", "Marte", "Vênus"], 1, "O Sol é uma estrela, a mais próxima de nós. A Lua não tem luz própria, ela só reflete a luz do Sol."],
    [1, "Quantas Luas a Terra tem?", ["Nenhuma", "Uma", "Duas", "Oito"], 1, "A Terra tem uma Lua. Júpiter e Saturno têm muitas dezenas de luas."],
    [1, "Qual é o formato da Terra?", ["Quadrado", "Disco plano", "Parecido com uma bola", "Triângulo"], 2, "A Terra é quase uma esfera, um pouquinho achatada nos polos."],
    [2, "Qual planeta é chamado de planeta vermelho?", ["Marte", "Netuno", "Mercúrio", "Saturno"], 0, "Marte parece vermelho por causa da poeira rica em ferro enferrujado na superfície."],
    [2, "Quantos planetas tem o Sistema Solar?", ["6", "7", "8", "9"], 2, "São 8 planetas, de Mercúrio a Netuno."],
    [2, "Qual planeta é famoso pelos anéis?", ["Saturno", "Terra", "Vênus", "Marte"], 0, "Os anéis de Saturno são feitos de gelo e pedaços de rocha. Júpiter, Urano e Netuno também têm anéis, mas bem fraquinhos."],
    [3, "Qual é o maior planeta do Sistema Solar?", ["Terra", "Saturno", "Júpiter", "Netuno"], 2, "Júpiter é tão grande que caberiam mais de mil Terras dentro dele."],
    [3, "Qual planeta está mais perto do Sol?", ["Vênus", "Mercúrio", "Terra", "Marte"], 1, "Mercúrio dá uma volta no Sol em apenas 88 dias."],
    [3, "Quanto tempo a Terra leva para dar uma volta no Sol?", ["Um dia", "Um mês", "Um ano", "Uma semana"], 2, "Um ano tem cerca de 365 dias e 6 horas. Essas horas sobrando juntam um dia extra a cada 4 anos: o ano bissexto."],
    [4, "O que causa o dia e a noite?", ["A Terra girando em torno de si mesma", "O Sol apagando", "A Lua cobrindo o Sol", "A Terra se afastando do Sol"], 0, "A Terra gira como um pião, uma volta a cada 24 horas. O lado voltado para o Sol é dia e o outro é noite."],
    [4, "Por que a Lua brilha no céu?", ["Tem luz própria", "Reflete a luz do Sol", "É feita de fogo", "Reflete a luz das estrelas"], 1, "A Lua é uma grande rocha que reflete a luz do Sol. As fases acontecem porque vemos partes diferentes do lado iluminado."],
    [4, "Como se chama a galáxia onde fica o Sistema Solar?", ["Andrômeda", "Via Láctea", "Órion", "Sírius"], 1, "A Via Láctea tem centenas de bilhões de estrelas, e o Sol é só uma delas."],
    [5, "Qual é o planeta mais quente do Sistema Solar?", ["Mercúrio", "Vênus", "Marte", "Júpiter"], 1, "Vênus passa de 460 graus, mais quente que Mercúrio, porque sua atmosfera espessa segura o calor."],
    [5, "Quem foi o primeiro ser humano a ir ao espaço?", ["Neil Armstrong", "Buzz Aldrin", "Yuri Gagarin", "Santos Dumont"], 2, "O russo Yuri Gagarin foi ao espaço em 1961 e deu uma volta ao redor da Terra."],
    [5, "Quem foi o primeiro brasileiro a ir ao espaço?", ["Marcos Pontes", "Santos Dumont", "Neil Armstrong", "Ayrton Senna"], 0, "Marcos Pontes foi em 2006. O Brasil também tem uma base de lançamento de foguetes em Alcântara, no Maranhão."],
    [6, "Quem foi o primeiro ser humano a pisar na Lua?", ["Yuri Gagarin", "Neil Armstrong", "Marcos Pontes", "Buzz Aldrin"], 1, "Neil Armstrong pisou na Lua em 1969, na missão Apollo 11. Buzz Aldrin foi logo depois dele."],
    [6, "O que é um eclipse solar?", ["A Lua passando entre a Terra e o Sol", "O Sol sumindo de vez", "A Terra passando entre o Sol e a Lua", "Um planeta cobrindo a Lua"], 0, "No eclipse solar a sombra da Lua cai sobre a Terra e o dia escurece por alguns minutos."],
    [6, "Qual é a diferença entre uma estrela e um planeta?", ["A estrela é sempre maior", "A estrela produz a própria luz", "O planeta tem anéis", "Não há diferença"], 1, "Estrelas, como o Sol, produzem luz e calor. Planetas só refletem a luz da estrela que os ilumina."],
    [7, "Quanto tempo a luz do Sol leva para chegar à Terra?", ["1 segundo", "Cerca de 8 minutos", "1 dia", "1 ano"], 1, "A luz viaja a cerca de 300 mil quilômetros por segundo e ainda assim gasta uns 8 minutos para vir do Sol. Vemos o Sol como ele era 8 minutos atrás."],
    [7, "Qual é a grande galáxia mais próxima da Via Láctea?", ["Andrômeda", "Órion", "Sírius", "Cometa"], 0, "Andrômeda está a cerca de 2,5 milhões de anos-luz e vem se aproximando da Via Láctea."],
    [7, "O que é o cinturão de asteroides?", ["Um anel de Saturno", "Rochas entre Marte e Júpiter", "Uma nuvem na Terra", "Um cinto de estrelas"], 1, "Entre Marte e Júpiter há milhões de rochas espaciais girando em volta do Sol."],
    [8, "Qual planeta gira praticamente deitado?", ["Urano", "Terra", "Marte", "Mercúrio"], 0, "Urano é inclinado quase 98 graus e parece rolar como uma bola ao redor do Sol."],
    [8, "Qual é o maior vulcão do Sistema Solar, em Marte?", ["Monte Fuji", "Monte Olimpo", "Vesúvio", "Krakatoa"], 1, "O Monte Olimpo tem cerca de 22 quilômetros de altura, bem mais que o Everest, que tem uns 8,8."],
    [8, "Por que Plutão deixou de ser chamado de planeta?", ["Explodiu", "Fugiu do Sistema Solar", "Virou planeta-anão numa nova definição de 2006", "Foi engolido por Netuno"], 2, "Em 2006 os astrônomos criaram uma regra nova para planetas. Plutão não a cumpre e passou a ser planeta-anão."],
    [9, "O que é um ano-luz?", ["Um ano com mais luz", "A distância que a luz percorre em um ano", "O tempo de uma volta ao Sol", "A idade de uma estrela"], 1, "Ano-luz mede distância, não tempo. É cerca de 9,5 trilhões de quilômetros."],

      else { V.confirmReset = true; render(); setTimeout(function () { if (V.confirmReset) { V.confirmReset = false; if (V.view === "parents") render(); } }, 5000); }
    }
  });
  app.addEventListener("change", function (e) {
    var el = e.target.closest("[data-act='setstart']"); if (!el) return;
    S.settings.start = parseInt(el.value, 10);
    S.level = S.settings.start; S.best = Math.max(S.best, S.level);
    save();
  });
  /* a música começa no primeiro toque (o navegador só libera som depois de um toque) */
  document.addEventListener("pointerdown", function () { if (S.settings.music) startMusic(); }, { once: true });
  try { if (window.speechSynthesis) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = function () {}; } } catch (e) {}

  /* ---------- Cena 3D: céu com planetas e o Quasar flutuando sobre o espaço reservado na página ---------- */
  var Face = { mood: "happy", cheer: -9999 };
  function init3d() {
    if (!window.THREE) return;
    var T = window.THREE, cv = document.createElement("canvas"), r;
    cv.id = "gl"; cv.setAttribute("aria-hidden", "true");
    try { r = new T.WebGLRenderer({ canvas: cv, alpha: true, antialias: true, powerPreference: "low-power" }); } catch (e) { return; }
    document.body.insertBefore(cv, app);
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    r.setClearColor(0x000000, 0);
    var scene = new T.Scene(), cam = new T.PerspectiveCamera(50, 1, 0.1, 400), reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    scene.add(new T.AmbientLight(0x8aa0ff, 0.55));
    var sunL = new T.DirectionalLight(0xfff0d0, 1.5); sunL.position.set(6, 8, 6); scene.add(sunL);
    var rim = new T.DirectionalLight(0x6ab4ff, 0.8); rim.position.set(-6, 2, -4); scene.add(rim);

    /* estrelas */
    var N = 900, pos = new Float32Array(N * 3), i;
    for (i = 0; i < N; i++) {
      var rad = 60 + Math.random() * 90, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
      pos[i * 3] = rad * Math.sin(ph) * Math.cos(th); pos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th); pos[i * 3 + 2] = -Math.abs(rad * Math.cos(ph)) - 10;
    }
    var sg = new T.BufferGeometry(); sg.setAttribute("position", new T.BufferAttribute(pos, 3));
    var stars = new T.Points(sg, new T.PointsMaterial({ color: 0xffffff, size: 0.9, sizeAttenuation: true, transparent: true, opacity: 0.9 }));
    scene.add(stars);

    /* planeta Terra com textura desenhada na hora */
    function earthTex() {
      var c = document.createElement("canvas"); c.width = 512; c.height = 256; var x = c.getContext("2d");
      var g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, "#1b4fd1"); g.addColorStop(.5, "#2a74f0"); g.addColorStop(1, "#1b4fd1");
      x.fillStyle = g; x.fillRect(0, 0, 512, 256);
      var k, j; x.fillStyle = "#2fa862";
      for (k = 0; k < 26; k++) { var cx = Math.random() * 512, cy = 40 + Math.random() * 176; for (j = 0; j < 7; j++) { x.beginPath(); x.arc(cx + (Math.random() - .5) * 60, cy + (Math.random() - .5) * 30, 8 + Math.random() * 22, 0, 6.3); x.fill(); } }
      x.fillStyle = "#8f7a45"; for (k = 0; k < 14; k++) { x.beginPath(); x.arc(Math.random() * 512, 60 + Math.random() * 140, 5 + Math.random() * 12, 0, 6.3); x.fill(); }
      x.fillStyle = "rgba(255,255,255,.75)"; for (k = 0; k < 40; k++) { x.beginPath(); x.ellipse(Math.random() * 512, Math.random() * 256, 14 + Math.random() * 40, 4 + Math.random() * 8, 0, 0, 6.3); x.fill(); }
      x.fillStyle = "rgba(255,255,255,.9)"; x.fillRect(0, 0, 512, 14); x.fillRect(0, 242, 512, 14);
      var t = new T.CanvasTexture(c); return t;
    }
    var earth = new T.Mesh(new T.SphereGeometry(1, 48, 48), new T.MeshStandardMaterial({ map: earthTex(), roughness: 0.8, metalness: 0 }));
    var atmo = new T.Mesh(new T.SphereGeometry(1.08, 48, 48), new T.MeshBasicMaterial({ color: 0x5fb0ff, transparent: true, opacity: 0.22, side: T.BackSide, blending: T.AdditiveBlending, depthWrite: false }));
    var earthG = new T.Group(); earthG.add(earth); earthG.add(atmo); scene.add(earthG);
    var moonG = new T.Group(), moon = new T.Mesh(new T.SphereGeometry(0.22, 24, 24), new T.MeshStandardMaterial({ color: 0xc9cbd6, roughness: 1 }));
    moon.position.set(1.9, 0.3, 0); moonG.add(moon); earthG.add(moonG);

    /* planeta com anéis */
    function bandTex() {
      var c = document.createElement("canvas"); c.width = 256; c.height = 128; var x = c.getContext("2d"), y, cols = ["#f5b76b", "#e08b3a", "#f7d29a", "#c96a2a", "#f0c07f"];
      for (y = 0; y < 128; y += 6) { x.fillStyle = cols[Math.floor(Math.random() * cols.length)]; x.fillRect(0, y, 256, 6 + (Math.random() * 4)); }
      return new T.CanvasTexture(c);
    }
    var ringP = new T.Group(), body = new T.Mesh(new T.SphereGeometry(1, 40, 40), new T.MeshStandardMaterial({ map: bandTex(), roughness: 0.9 }));
    var ring = new T.Mesh(new T.RingGeometry(1.4, 2.2, 64), new T.MeshBasicMaterial({ color: 0xf3d9a6, side: T.DoubleSide, transparent: true, opacity: 0.7 }));
    ring.rotation.x = Math.PI / 2.3; ringP.add(body); ringP.add(ring); ringP.rotation.z = -0.35; scene.add(ringP);

    /* Quasar 3D */
    var faceC = document.createElement("canvas"); faceC.width = 512; faceC.height = 256;
    var faceX = faceC.getContext("2d"), faceTex = new T.CanvasTexture(faceC);
    function rr(x, a, b, w, h, rd) { x.beginPath(); x.moveTo(a + rd, b); x.arcTo(a + w, b, a + w, b + h, rd); x.arcTo(a + w, b + h, a, b + h, rd); x.arcTo(a, b + h, a, b, rd); x.arcTo(a, b, a + w, b, rd); x.closePath(); }
    var lastFace = "";
    function drawFace(mood, open, blink) {
      var key = mood + "|" + Math.round(open * 6) + "|" + blink; if (key === lastFace) return; lastFace = key;
      var w = 512, h = 256, x = faceX; x.clearRect(0, 0, w, h);
      var g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#16296c"); g.addColorStop(1, "#060b26");
      rr(x, 8, 8, w - 16, h - 16, 100); x.fillStyle = g; x.fill(); x.lineWidth = 6; x.strokeStyle = "rgba(143,211,255,.55)"; x.stroke();
      x.shadowColor = "#8fd3ff"; x.shadowBlur = 22; x.fillStyle = "#8fd3ff"; x.strokeStyle = "#8fd3ff"; x.lineCap = "round";
      var er = mood === "sad" ? 24 : 32, ery = blink ? 4 : er;
      x.beginPath(); x.ellipse(170, 100, er, ery, 0, 0, 6.3); x.fill(); x.beginPath(); x.ellipse(342, 100, er, ery, 0, 0, 6.3); x.fill();
      if (mood === "sad") { x.lineWidth = 8; x.beginPath(); x.moveTo(130, 62); x.lineTo(200, 78); x.moveTo(382, 62); x.lineTo(312, 78); x.stroke(); }
      if (open > 0.05) { x.beginPath(); x.ellipse(256, 176, 40, 10 + 34 * open, 0, 0, 6.3); x.fill(); }
      else { x.lineWidth = 9; x.beginPath(); if (mood === "sad") { x.moveTo(206, 190); x.quadraticCurveTo(256, 158, 306, 190); } else { x.moveTo(200, 168); x.quadraticCurveTo(256, 214, 312, 168); } x.stroke(); }
      faceTex.needsUpdate = true;
    }
    var q = new T.Group(), white = new T.MeshStandardMaterial({ color: 0xf4f7ff, roughness: 0.35, metalness: 0.1 }), grey = new T.MeshStandardMaterial({ color: 0xc7d3fa, roughness: 0.5 });
    var glowY = new T.MeshBasicMaterial({ color: 0xffc531 });
    function mesh(geo, mat, x, y, z) { var m = new T.Mesh(geo, mat); m.position.set(x, y, z); q.add(m); return m; }
    var torso = mesh(new T.SphereGeometry(0.95, 32, 24), white, 0, -0.95, 0); torso.scale.set(1, 1.08, 0.85);
    mesh(new T.SphereGeometry(0.2, 20, 16), glowY, 0, -0.85, 0.74);
    var head = new T.Group(); head.position.set(0, 0.7, 0); q.add(head);
    var helm = new T.Mesh(new T.SphereGeometry(1.2, 40, 32), white); head.add(helm);
    var visor = new T.Mesh(new T.SphereGeometry(1.215, 40, 24, Math.PI / 2 - 0.95, 1.9, Math.PI / 2 - 0.62, 1.15), new T.MeshBasicMaterial({ map: faceTex, transparent: true }));
    head.add(visor);
    var ant = new T.Mesh(new T.CylinderGeometry(0.04, 0.04, 0.55, 8), grey); ant.position.set(0, 1.45, 0); head.add(ant);
    var tip = new T.Mesh(new T.SphereGeometry(0.14, 16, 12), glowY); tip.position.set(0, 1.78, 0); head.add(tip);
    var armL = new T.Group(), armR = new T.Group();
    [armL, armR].forEach(function (a, k) {
      var s = k ? 1 : -1; a.position.set(s * 1.0, -0.55, 0);
      var u = new T.Mesh(new T.CylinderGeometry(0.2, 0.2, 0.9, 16), grey); u.position.set(s * 0.12, -0.4, 0); u.rotation.z = s * 0.3; a.add(u);
      var h = new T.Mesh(new T.SphereGeometry(0.24, 16, 12), white); h.position.set(s * 0.3, -0.88, 0); a.add(h); q.add(a);
    });
    var legL = mesh(new T.CylinderGeometry(0.26, 0.3, 0.7, 16), grey, -0.4, -2.0, 0), legR = mesh(new T.CylinderGeometry(0.26, 0.3, 0.7, 16), grey, 0.4, -2.0, 0);
    mesh(new T.SphereGeometry(0.34, 16, 12), white, -0.4, -2.38, 0.08).scale.set(1, .6, 1.3); mesh(new T.SphereGeometry(0.34, 16, 12), white, 0.4, -2.38, 0.08).scale.set(1, .6, 1.3);
    var jet = new T.Group(); jet.position.set(0, -0.8, -0.85);
    [-0.45, 0.45].forEach(function (x) { var c = new T.Mesh(new T.CylinderGeometry(0.28, 0.28, 1.2, 16), new T.MeshStandardMaterial({ color: 0x6c7bc4, roughness: .4, metalness: .3 })); c.position.x = x; jet.add(c); var f = new T.Mesh(new T.ConeGeometry(0.22, 0.9, 12), new T.MeshBasicMaterial({ color: 0xff8a3d })); f.position.set(x, -1.0, 0); f.rotation.x = Math.PI; f.name = "fl"; jet.add(f); });
    q.add(jet);
    var MODEL_H = 5.0; scene.add(q); q.visible = false;

    function size() { var w = window.innerWidth, h = window.innerHeight; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); layout(); }
    function layout() {
      var d = 30, hh = Math.tan(cam.fov * Math.PI / 360) * d, hw = hh * cam.aspect;
      earthG.position.set(-hw * 0.5, -hh * 0.78, -d); earthG.scale.setScalar(hh * 0.5);
      var d2 = 55, hh2 = Math.tan(cam.fov * Math.PI / 360) * d2, hw2 = hh2 * cam.aspect;
      ringP.position.set(hw2 * 0.6, hh2 * 0.66, -d2); ringP.scale.setScalar(hh2 * 0.13);
    }
    size(); window.addEventListener("resize", size);
    var px = 0, py = 0;
    window.addEventListener("pointermove", function (e) { px = (e.clientX / window.innerWidth) * 2 - 1; py = (e.clientY / window.innerHeight) * 2 - 1; });
    document.body.classList.add("has3d");
    var vec = new T.Vector3(), t0 = performance.now(), run = true;
    document.addEventListener("visibilitychange", function () { run = !document.hidden; if (run) loop(); });
    function loop() {
      if (!run) return;
      var now = performance.now(), t = (now - t0) / 1000, k = reduce ? 0.2 : 1;
      earth.rotation.y = t * 0.05 * k; moonG.rotation.y = t * 0.25 * k; ringP.rotation.y = t * 0.03 * k; stars.rotation.y = t * 0.004 * k;
      cam.position.set(px * 0.6, -py * 0.4 - window.scrollY * 0.002, 0); cam.lookAt(0, 0, -30); cam.updateMatrixWorld();

      var sl = document.querySelector(".q-slot");
      if (sl) {
        var b = sl.getBoundingClientRect(), W = window.innerWidth, H = window.innerHeight;
        if (b.bottom > 0 && b.top < H) {
          var d = 12, nx = ((b.left + b.width / 2) / W) * 2 - 1, ny = -(((b.top + b.height / 2) / H) * 2 - 1);
          vec.set(nx, ny, 0.5).unproject(cam).sub(cam.position).normalize();
          var tt = (d) / -vec.z; q.position.copy(cam.position).addScaledVector(vec, tt);
          var worldH = 2 * d * Math.tan(cam.fov * Math.PI / 360), sc = (b.height / H) * worldH / MODEL_H;
          q.scale.setScalar(sc);
          var cheer = (now - Face.cheer) / 1000, hop = cheer < 1 ? Math.sin(cheer * Math.PI) * 0.45 * sc * MODEL_H : 0;
          q.position.y += hop + Math.sin(t * 1.8) * 0.05 * sc * MODEL_H;
          q.rotation.y = (cheer < 1 ? cheer * Math.PI * 2 : 0) + px * 0.35 + Math.sin(t * 0.6) * 0.12;
          head.rotation.y = px * 0.25; head.rotation.x = py * 0.12;
          armL.rotation.z = Math.sin(t * 2) * 0.12 + (cheer < 1 ? 1.9 : 0); armR.rotation.z = -Math.sin(t * 2 + 1) * 0.12 - (cheer < 1 ? 1.9 : 0);
          var eq = equipment(); jet.visible = eq.jet;
          if (eq.jet) { jet.children.forEach(function (c) { if (c.name === "fl") c.scale.y = 0.8 + Math.random() * 0.5; }); }
          var open = 0;
          if (Talk.on && VOICE.an) { VOICE.an.getByteTimeDomainData(VOICE.buf); var sum = 0, j, vv; for (j = 0; j < VOICE.buf.length; j++) { vv = (VOICE.buf[j] - 128) / 128; sum += vv * vv; } open = Math.min(1, Math.sqrt(sum / VOICE.buf.length) * 7); }
          drawFace(Face.mood, Math.max(0, open), (t % 4) < 0.12 ? 1 : 0);
          tip.scale.setScalar(1 + Math.sin(t * 4) * 0.2);
          q.visible = true;
        } else q.visible = false;
      } else q.visible = false;
      r.render(scene, cam);
      requestAnimationFrame(loop);
    }
    loop();
  }
  try { init3d(); } catch (e) { var g = document.getElementById("gl"); if (g) g.remove(); document.body.classList.remove("has3d"); }

  render();
})();
</script>
